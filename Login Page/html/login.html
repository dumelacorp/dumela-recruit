<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>

    <style>
        body { 
    background-color: white;
    overflow-y: hidden;
    border-radius: 20px;
}
.logo {
    position: relative;
    margin-top: 30px;
    border-radius: 10px;
}

.background-img {
    position: absolute;
    width: 700px; 
    height: 135vh;
    margin-top: -240px;
    margin-left: -140px;
    margin-bottom: 0px;
    z-index: -1;
}

.rotate-image {
    transform: rotate(20deg);
}

.label {
    width: 118px;
    height: 63px;
}
  
  .label .text-wrapper {
    position: relative;
    margin-left: 900px;
    font-family: "Poppins-ExtraBold", Helvetica;
    font-weight: 800;
    color: #00cf8e;
    font-size: 42px;
    letter-spacing: 0;
    line-height: normal;
    text-decoration: underline;
    align-items: center;
}



.row {
    color:#008080;
    margin-left: 400px;
}

form{
	padding: 0 2em;
}
.form__input{
	width: 50%;
	border:0px solid transparent;
	border-radius: 0;
	border-bottom: 1px solid #aaa;
	padding: 1em 1.5em .5em;
	padding-left: 2em;
	outline:none;
	margin:1.5em auto;
	transition: all .5s ease;
  font-family: "Inter-Regular", Helvetica;
  font-weight: 400;
  color: #000000;
  font-size: 14px;
  letter-spacing: 0;
  line-height: normal;
}
.form__input:focus{
	border-bottom-color: #008080;
	box-shadow: 0 0 5px rgba(0,80,80,.4); 
	border-radius: 4px;
}
.login{
	transition: all .5s ease;
	border-radius: 30px;
	color:#fff;
	font-weight: 600;
	background-color: #00CF8E;
	margin-top: 1.5em;
	margin-bottom: 1em;
  margin-left: 80px;
  border:none;
  box-shadow: none;
  width: 130px;
  height: 40px;
  line-height: 42px;
}
.login:hover, .login:focus{
	background-color:#fff;
	color: #00CF8E;
    border: 1px solid #00CF8E;
    cursor: pointer;
}

.login-button {
  text-decoration: none;
  color:color(from color srgb r g b);
}

.bxs-lock , .bxs-user {
    font-size: 30px;
}

.forgot-password {
    font-family: "Inter-ExtraBold", Helvetica;
    font-weight: 800;
    color: #00cf8e;
    font-size: 12px;
    letter-spacing: 0;
    line-height: normal;
    cursor: pointer;
}

h1 {
    display: flex;
    flex-direction: row;
    color: #000000;
    font-size: 12px;
    padding-bottom: 10px;
    padding-top: 10px;
}

.sign-in {
    margin-left: 30px;
    width: 230px;
    justify-items: center;
}

.google, .apple {
    transition: all .5s ease;
    border-radius: 30px;
    height: 40px;
    width: 200px;
    border-width: solid 1px;
    flex-wrap: nowrap;
    background-color: #fff;
    cursor: pointer;
    font-size: 18px;
    margin-left: 20px;
    -webkit-transition: background-color .218s, border-color .218s, box-shadow .218s;
    transition: background-color .218s, border-color .218s, box-shadow .218s;
}

.google:hover, .apple:hover, .apple:hover, .google:focus{
	background-color:#fff;
	color: #00CF8E;
    border: 1px solid #00CF8E;
    cursor: pointer;
}

.apple {
    margin-top: 10px;
}

.bx {
    font-size: 16.5px;
}
    </style>
    
</head>
<body>
    <div> 
        <div>
            <a href="/Login Page/html/login.html"><img class="logo" src="/Login Page/img/dum_logo.png" alt="Dumela Corp" width="148px"; height="48px"></a>
        </div> 
        <div class="image"><img class="background-img rotate-image" src="/Login Page/img/protoring.jpg" alt=""></div>
    </div>
    
    <div id="login-area">
        <div class="label">
            <div class="text-wrapper">Login</div>
        </div>

        <div class="row">
						<form control="" class="form-group">
							<div class="row">
								<input type="text" name="username" id="username" class="form__input" placeholder="Username">
                                <i class='bx bxs-user'></i>
							</div>
							<div class="row">
								<!-- <span class="fa fa-lock"></span> -->
								<input type="password" name="password" id="password" class="form__input" placeholder="Password">
                                <i class='bx bxs-lock'></i>
							</div>
							<div class="row">
								<a href="/Login Page/html/login.html"><label class="forgot-password" for="forgot-password">Forgot Password?</label></a>
							</div>
							<div class="row">
								<!-- <input type="submit" value="Submit" class="btn"> -->
                                <button id="submit" type="submit" class="login"><a class="login-button" href="/Login Page/html/instructions/instruction1.html">Login</a></button>
							</div>
                            <div class="row">
                                <div class="sign-in">
                                    <h1>Or Sign in With</h1>

                                    <button id="google-signin" type="submit" class="google"><i class='bx bxl-google'></i>  Sign in with Google</button>
                                    
                                    <button id="appleid-signin" type="submit" class="apple"><i class='bx bxl-apple'></i>  Sign in with Apple</button>

                                </div>
                            </div>
						</form>
					</div>
					<div class="row">
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Check Page</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/Login Page/css/technical-check/check.css">
</head>
<body>
    
    <div> 
        <div class="image"><img class="background-img rotate-image" src="/Login Page/img/protoring.jpg" alt=""></div>
    </div>
    <div>
        <a href="/Login Page/html/login.html"><img class="logo" src="/Login Page/img/dum_logo.png" alt="Dumela Corp" width="148px"; height="48px"></a>
    </div> 


    <div class="instructions">
        
        <div class="parent1">
            <div class="child1">
                <img src="/Login Page/img/compatabilty.png" alt="Compatability Check" width="50px" height="50px">
            </div>
            <div class="child2"><h3>BROWSER COMPATABILITY</h3></div>
        </div>
        
        <div class="parent2">
            <div class="child1">
                <p>Check if your browser is supported.</p>
                <p>List of supported browsers:</p>

                <ol>
                    <li>Google Chrome</li>
                    <li>Mozilla Firefox</li>
                    <li>Safari</li>
                </ol>
            </div>

            <div class="child2 browser">
                <a href="#"><button class="next">Check Browser Compatability</button></a>
            </div>
        </div>
        <div class="parent1">
            <div class="child1">
                <img src="/Login Page/img/high-speed.png" alt="Speed Check" width="50px" height="50px">
            </div>
            <div class="child2"><h3>INTERNET SPEED TEST</h3></div>
        </div>
        
        <div class="parent2">
            <div class="child1">
                <p>Check your internet connection speed.</p>
            </div>

            <div class="child2 speed">
                <a href="#"><button class="next">Run Speed Test</button></a>
            </div>
        </div>

    </div>

</body>
</html>

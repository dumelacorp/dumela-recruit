<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Check Page</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <link rel="stylesheet" href="/Login Page/css/technical-check/check.css">
</head>
<body>
    
    <div> 
        <div class="image"><img class="background-img rotate-image" src="/Login Page/img/protoring.jpg" alt=""></div>
    </div>
    <div>
        <a href="/Login Page/html/login.html"><img class="logo" src="/Login Page/img/dum_logo.png" alt="Dumela Corp" width="148px"; height="48px"></a>
    </div> 


    <div class="instructions">
        
        <div class="parent1">
            <div class="child1">
                <img src="/Login Page/img/webcam.png" alt="Webcam Check" width="50px" height="50px">
            </div>
            <div class="child2"><h3>WEBCAM CHECK</h3></div>
        </div>
        
        <div class="parent2">
            <div class="child1">
                <p>Ensure your webcam is working correctly.</p>
                <p>Live webcam feed preview</p>
            </div>

            <div class="child2 webcam">
                <a href="#"><button class="next">Take Webcam Photo</button></a>
            </div>
        </div>
        <div class="parent1 bottom">
            <div class="child1">
                <img src="/Login Page/img/microphone.png" alt="Microphone Check" width="50px" height="50px">
            </div>
            
            <div class="child2"><h3>MICROPHONE CHECK</h3></div>
        </div>
        
        <div class="parent2">
            <div class="child1">
                <p>Ensure your microphone is working correctly.</p>
            </div>

            <div class="child2 microphone">
                <a href="#"><button class="next">Record Audio</button></a>
            </div>
        </div>

    </div>

</body>
</html>

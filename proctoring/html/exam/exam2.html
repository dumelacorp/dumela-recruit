<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Interface2</title>

    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <!-- <link rel="stylesheet" href="/Login Page/css/exam.css"> -->
    <link rel="stylesheet" href="../../css/exam.css">

</head>
<body>
    <div class="parent1">
        <div class ="camera-feed child1">
            Live Feed
        </div>

        <div class="candidate-name child2">
            <div>
                <!-- <img src="/Login Page/img/profile.png" alt="Profile" -->
                <img src="../../img/profile.png" alt="Profile"
                class="prof"          
                width="20px" 
                height="20px">
                <h4>Helena Adetutu</h4></div>
            </div>
    </div>
    <div class="parent1">
        <div class="child1 dash-icon">
            <div class="parent dashboard">
                <div class="child1">
                    <!-- <img src="/Login Page/img/dashboard.png" alt="Dashboard" -->
                    <img src="../../img/dashboard.png" alt="Dashboard"
                    class="dash"          
                    width="20px" 
                    height="20px">
                </div>
                <div class="child2">
                    <h4>Dashboard</h4>
                </div>
            </div>

            <div>
                <div class="parent support">
                    <div class="child1">
                        <!-- <img src="/Login Page/img/support.png" alt="Support" -->
                        <img src="../../img/support.png" alt="Support"
                        class="support1"     
                        width="20px" 
                        height="20px">
                    </div>
                    <div class="child2">
                        <h4>Support</h4>
                    </div>
                </div>  
            </div>

            <div class="parent notification">
                    <div class="child1">
                        <!-- <img src="/Login Page/img/notif.png" alt="Notification" -->
                        <img src="../../img/notif.png" alt="Notification"
                        class="notif"     
                        width="20px" 
                        height="20px">
                    </div>
                    <div class="child2">
                        <h4>Notification</h4>
                    </div>
            </div>  

            <div class="calculator">
                    <h4>Calculator</h4>
            </div>

            <h3>Total Questions: <br><number class="question-no">20</number></h3>

            <div class="number-grid">
                <h3>Number Grid</h3>
            </div>

            <div class="submit">
               <a href="#"> 
                <button id="submit">
                    SUBMIT
                </button>
            </a>
        </div>

        </div>
        <div class="child2">
            <div class="exam">
                <div>
                    <div class="parent topic">
                        <div class="child1 exam-name">
                            <h1>ENGLISH EXAMS</h1>
                        </div>
                        <div class="child2 timer">
                            <h2>Timer: 30:00Mins</h2>
                        </div>
                    </div>

                    <div class="questions">
                        <div class="form-field">
                            <div class="parent">
                                <div class="child1">
                                    <div for="dropdown" id="dropdown-label">Question 1/20</div>
                                </div>

                                <div class="child2 options">
                                    <select name="type" id="dropdown">
                                        <option value="" disabled selected></option>
                                        <option value="point">1</option>
                                        <option value="point">2</option>
                                        <option value="point">3</option>
                                        <option value="point">4</option>
                                        <option value="point">5</option>
                                        <option value="point">6</option>
                                        <option value="point">7</option>
                                        <option value="point">8</option>
                                        <option value="point">9</option>
                                        <option value="point">10</option>
                                        <option value="point">11</option>
                                        <option value="point">12</option>
                                        <option value="point">13</option>
                                        <option value="point">14</option>
                                        <option value="point">15</option>
                                        <option value="point">16</option>
                                        <option value="point">17</option>
                                        <option value="point">18</option>
                                        <option value="point">19</option>
                                        <option value="point">20</option>
                                    </select>
                                </div>
                            </div>
                           </div>
                    </div>

                    <div class="question-frame">
                        <p>"Compare and contrast the impact of traditional education versus online education on student success."</p>
                    </div>

                    <p class="comment">Short Answer</p>

                    <div class="answer">
                        <textarea id="answer" name="answer" rows="10%" cols= 100% placeholder="Type your answer here">
                        </textarea>
                    </div>
                    
                </div>
            </div>
        </div>

        <div class="child3">
            <div class="parent1">
                <div class="child1"> 
                    <!-- <a href="/Login Page/html/exam/exam1.html"> -->
                    <a href="../../html/exam/exam1.html">
                        <button class="prev-question"><</button>
                    </a>
                </div>
                <div class="child2">
                    <a href="#">
                        <button class="next-question">></button>
                    </a>
                </div>
            </div>
        </div>

      </div>
</body>
</html>
